name: CI/CD Pipeline

# Déclencheurs : à chaque push sur main/develop et à chaque pull request vers main
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # Permet de lancer le pipeline manuellement depuis l'onglet Actions

env:
  IMAGE_NAME: devops-secure-pipeline
  NODE_VERSION: '20'

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # JOB 1 — Qualité du code : lint + tests unitaires
  # ══════════════════════════════════════════════════════════════════════
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Installation des dépendances
        working-directory: ./app
        run: npm ci

      - name: Analyse statique du code (lint)
        working-directory: ./app
        run: npm run lint

      - name: Exécution des tests unitaires
        working-directory: ./app
        run: npm test -- --coverage

      - name: Publication du rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/coverage/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════
  # JOB 2 — Audit des dépendances (détection de CVE dans npm)
  # ══════════════════════════════════════════════════════════════════════
  dependency-audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit npm (échoue si vulnérabilité haute ou critique)
        working-directory: ./app
        run: npm audit --audit-level=high

  # ══════════════════════════════════════════════════════════════════════
  # JOB 3 — Build de l'image Docker + scan de sécurité Trivy
  # ══════════════════════════════════════════════════════════════════════
  build-and-scan:
    name: Build Docker & Scan Trivy
    runs-on: ubuntu-latest
    needs: [test, dependency-audit] # Ne s'exécute que si les jobs précédents réussissent

    permissions:
      contents: read
      security-events: write # Nécessaire pour publier les résultats dans l'onglet Security

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image Docker (local, pas encore de push)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Publication des résultats Trivy dans GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Scan Trivy bloquant (échoue si CRITICAL trouvé)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1' # Bloque le pipeline si une vulnérabilité critique est détectée
          ignore-unfixed: true

  # ══════════════════════════════════════════════════════════════════════
  # JOB 4 — Publication de l'image sur Docker Hub (uniquement sur main)
  # ══════════════════════════════════════════════════════════════════════
  push-image:
    name: Push vers Docker Hub
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraction des métadonnées (tags automatiques)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}

      - name: Build et push de l'image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé du déploiement
        run: |
          echo "### Image publiée avec succès :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags :**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
